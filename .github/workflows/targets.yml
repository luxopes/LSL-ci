# Testy cílů na skutečných strojích (Windows, Linux arm64, macOS Apple
# Silicon a Intel), ve WebAssembly (Node s WASI) a na bare metal RISC-V
# (qemu-system). Ubuntu x86_64 sestaví kompilátor ze
# zabaleného bootstrapu (compiler/pure/lslc-qbe), runtime cílů a přeloží
# konformní testy; stroje cíle je spustí a porovnají s tests/*.out.
name: targets

on:
  push:
    branches: ['main', 'work/**']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release v LSL-ci s archivy vydání: release-native je otestuje na skutečných strojích'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev binutils-aarch64-linux-gnu binutils-riscv64-linux-gnu binutils-arm-linux-gnueabihf clang lld wabt
          # Linker Mach-O (macOS) z LLVM pod jménem, které hledá kompilátor.
          sudo ln -sf $(ls /usr/lib/llvm-*/bin/ld64.lld | sort -V | tail -1) /usr/bin/ld64.lld
      - name: Compiler from the bootstrap
        run: |
          mkdir -p build/ci
          compiler/pure/lslc-qbe compiler/pure/lslc_qbe.lsl build/ci/lslc1
          build/ci/lslc1 compiler/pure/lslc_qbe.lsl build/ci/lslc
      - name: LuxIR source (veřejný mirror, připnutý commit z release.json)
        run: |
          commit=$(python3 -c "import json; print(json.load(open('release.json'))['backend']['commit'])")
          git clone --quiet https://github.com/luxopes/LuxIR.git build/dependencies/LuxIR
          git -C build/dependencies/LuxIR checkout --quiet --detach "$commit"
      - name: LuxIR backend from the pinned source (32-bit arm and i386)
        run: build/ci/lslc build/dependencies/LuxIR/lsl/luxir.lsl build/ci/luxir
      - name: Target runtimes
        run: |
          for target in windows-x86_64 windows-arm64 linux-arm64 linux-riscv64 macos-x86_64 macos-arm64 wasm32-wasi baremetal-riscv64; do
            python3 tools/runtime/build.py --compiler build/ci/lslc --target $target --bootstrap-runtime compiler/qbe/runtime.o
          done
          # 32bitové cíle: backendy LuxIR arm a i386 (binutils, bez C).
          for target in linux-arm linux-x86; do
            python3 tools/runtime/build.py --compiler build/ci/lslc --target $target --backend build/ci/luxir --bootstrap-runtime compiler/qbe/runtime.o
          done
      - name: LLVM tools for Windows packages
        run: |
          set -e
          for spec in x86_64:f229769f11d6a6edc8ada599c0cda964b7dee6ab1a08c6cf9dd7f513e85b107f aarch64:0df3e81e8fe26370dd2b60b9e009d81cd130d3fdc41b257434aa663c5d9f0c13; do
            arch=${spec%%:*}; sum=${spec#*:}
            file=clang+llvm-20.1.8-$arch-pc-windows-msvc.tar.xz
            curl -sSfL -o $file https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/$file
            echo "$sum  $file" | sha256sum -c -
            mkdir -p llvm-$arch
            tar -xJf $file --strip-components=2 -C llvm-$arch --wildcards '*/bin/llvm-mc.exe' '*/bin/lld.exe'
            rm $file
            curl -sSfL -o llvm-$arch/LICENSE-LLVM.txt https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-20.1.8/llvm/LICENSE.TXT
            curl -sSfL -o llvm-$arch/LICENSE-lld.txt https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-20.1.8/lld/LICENSE.TXT
          done
      - name: Manual for the native packages (published manual archive)
        run: |
          curl -sSfL -o manual.zip https://lsl.lux-ai.cz/downloads/lsl-0.10.0-manual.zip
          mkdir -p build/manual-source
          unzip -q -j manual.zip '*.md' -d build/manual-source
          rm -f build/manual-source/RELEASE_NOTES.md
          printf '{"repository": "ci", "note": "manual from lsl-0.10.0-manual.zip for CI packages"}\n' > build/manual-source/SOURCE.json
      - name: Native compiler packages (Windows, macOS)
        run: |
          for spec in windows-x86_64:x86_64 windows-arm64:aarch64 macos-x86_64: macos-arm64:; do
            name=${spec%%:*}; arch=${spec#*:}
            extra=""
            if [ -n "$arch" ]; then extra="--llvm llvm-$arch"; fi
            python3 tools/release/build_target_tools.py --target $name --output native/$name --compiler build/ci/lslc --backend compiler/pure/luxir --layout $extra
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: native/
          retention-days: 7
      - name: Test bundles
        run: |
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target windows-x86_64 --output bundle/windows-x86_64
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target windows-arm64 --output bundle/windows-arm64
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target linux-arm64 --output bundle/linux-arm64
          LSL_BACKEND=$PWD/build/ci/luxir python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target linux-arm --output bundle/linux-arm
          LSL_BACKEND=$PWD/build/ci/luxir python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target linux-x86 --output bundle/linux-x86
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target linux-x86_64 --output bundle/linux-x86_64
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target macos-x86_64 --output bundle/macos-x86_64
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target macos-arm64 --output bundle/macos-arm64
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target wasm32-wasi --output bundle/wasm32-wasi
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target wasm32-wasi-threads --output bundle/wasm32-wasi-threads
          python3 tools/ci/target_tests.py build --compiler build/ci/lslc --target baremetal-riscv64 --output bundle/baremetal-riscv64
          for target in macos-x86_64 macos-arm64; do
            build/ci/lslc --target $target tools/ci/tls_serve.lsl bundle/$target/tls-serve
            build/ci/lslc --target $target tools/ci/sandbox_check.lsl bundle/$target/sandbox-check
            build/ci/lslc --target $target tools/ci/sandbox_child.lsl bundle/$target/sandbox-child
          done
          build/ci/lslc --target windows-x86_64 tools/ci/tls_serve.lsl bundle/windows-x86_64/tls-serve.exe
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: bundle/
          retention-days: 7

  # Překladač přímo na Windows a macOS: přeloží všechny testy nativně, spustí
  # je a ověří fixed point (stupeň 2 = stupeň 3, oba přeložené na stroji).
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, target: windows-x86_64}
          - {runner: windows-11-arm, target: windows-arm64}
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x86_64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native
      - name: Native compiler on ${{ matrix.target }}
        shell: bash
        run: |
          chmod +x native/${{ matrix.target }}/bin/* || true
          python tools/ci/target_tests.py native native/${{ matrix.target }} bundle/${{ matrix.target }}
      - name: Self-update on ${{ matrix.target }} (production stable-v2 channel)
        shell: bash
        run: python tools/ci/update_e2e.py native/${{ matrix.target }}

  # Přesné archivy vydání (ne balíky sestavené v CI s binutils Ubuntu):
  # stáhne je z draft release a spustí tytéž nativní testy.
  release-native:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, target: windows-x86_64, archive: windows-x86_64.zip}
          - {runner: windows-11-arm, target: windows-arm64, archive: windows-arm64.zip}
          - {runner: macos-15, target: macos-arm64, archive: macos-arm64.tar.gz}
          - {runner: macos-15-intel, target: macos-x86_64, archive: macos-x86_64.tar.gz}
          - {runner: ubuntu-24.04-arm, target: linux-arm64, archive: linux-aarch64.tar.gz}
          - {runner: ubuntu-24.04, target: linux-x86_64, archive: linux-x86_64.tar.gz}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundle
      - name: Release archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" -D release -p '*-${{ matrix.archive }}' -p '*-SHA256SUMS'
          cd release
          grep -- '-${{ matrix.archive }}$' *-SHA256SUMS > check.txt
          test $(wc -l < check.txt) -eq 1
          python -c "import hashlib,sys;h,n=open('check.txt').read().split();d=hashlib.sha256(open(n,'rb').read()).hexdigest();print(n,d);sys.exit(d!=h)"
          python -c "import sys,tarfile,zipfile;n=sys.argv[1];(zipfile.ZipFile(n) if n.endswith('.zip') else tarfile.open(n)).extractall('x')" *-${{ matrix.archive }}
          ls x
      - name: Release compiler on ${{ matrix.target }}
        shell: bash
        run: |
          package=$(ls -d release/x/lsl-*)
          python tools/ci/target_tests.py native "$package" bundle/${{ matrix.target }}

  run:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, bundle: windows-x86_64}
          # Windows na ARM: nativní arm64 a x86_64 v emulaci (Prism).
          - {runner: windows-11-arm, bundle: windows-arm64}
          - {runner: windows-11-arm, bundle: windows-x86_64}
          - {runner: ubuntu-24.04-arm, bundle: linux-arm64}
          # 32bitový Linux: x86 nativně (jádro x86_64), ARM v qemu-user.
          - {runner: ubuntu-24.04, bundle: linux-x86}
          - {runner: ubuntu-24.04, bundle: linux-arm}
          - {runner: macos-15, bundle: macos-arm64}
          - {runner: macos-15-intel, bundle: macos-x86_64}
          # WebAssembly v Node (WASI preview1).
          - {runner: ubuntu-24.04, bundle: wasm32-wasi}
          # WebAssembly s vlákny (wasi-threads): Node a wasmtime.
          - {runner: ubuntu-24.04, bundle: wasm32-wasi-threads}
          # Bare metal RISC-V v qemu-system (deska virt, semihosting).
          - {runner: ubuntu-24.04, bundle: baremetal-riscv64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: startsWith(matrix.bundle, 'wasm32-')
        with:
          node-version: '24'
      - name: Install qemu-system-riscv64
        if: matrix.bundle == 'baremetal-riscv64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-misc
      - name: qemu-user for 32-bit ARM (binfmt, current static qemu)
        if: matrix.bundle == 'linux-arm'
        # qemu 8.2 z Ubuntu 24.04 vrací u accept4 EINVAL; statické qemu
        # z tonistiigi/binfmt je novější.
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundle
      - name: Run ${{ matrix.bundle }} tests
        run: python tools/ci/target_tests.py run bundle/${{ matrix.bundle }}
      - name: Run ${{ matrix.bundle }} tests in wasmtime
        if: matrix.bundle == 'wasm32-wasi-threads'
        shell: bash
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v26.0.1/wasmtime-v26.0.1-x86_64-linux.tar.xz | tar -xJ
          export PATH="$PWD/wasmtime-v26.0.1-x86_64-linux:$PATH"
          LSL_WASM_RUNNER=wasmtime python tools/ci/target_tests.py run bundle/${{ matrix.bundle }}
      - name: Process sandbox
        if: startsWith(matrix.bundle, 'macos')
        run: |
          b="$GITHUB_WORKSPACE/bundle/${{ matrix.bundle }}"
          chmod +x "$b/sandbox-check" "$b/sandbox-child"
          "$b/sandbox-check" "$b/sandbox-child" "$(mktemp -d)" | tee sandbox.txt
          for line in "available True" "input hello" "secret readable False" "profile strict" "status 0" "output written" "timeout 124"; do
            grep -qx "$line" sandbox.txt || { echo "missing: $line"; exit 1; }
          done
      - name: HTTPS through nginx
        if: startsWith(matrix.bundle, 'macos') || matrix.runner == 'windows-2025'
        shell: bash
        run: |
          set -x
          case "${{ matrix.bundle }}" in
            macos-*) brew install nginx; serve=tls-serve;;
            *) choco install nginx -y --no-progress; serve=tls-serve.exe;;
          esac
          command -v nginx openssl curl || true
          cd "$RUNNER_TEMP"
          # Git Bash by /CN=... převedl na cestu Windows.
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 1 -subj /CN=localhost
          mkdir -p www && echo "lsl https" > www/index.html
          chmod +x "$GITHUB_WORKSPACE/bundle/${{ matrix.bundle }}/$serve"
          "$GITHUB_WORKSPACE/bundle/${{ matrix.bundle }}/$serve" www 18443 cert.pem key.pem > server.log 2>&1 &
          server=$!
          for i in $(seq 1 30); do curl -sk https://127.0.0.1:18443/index.html > got.txt && break; sleep 1; done
          set +e
          kill $server
          wait $server
          echo "tls-serve exit $?"
          set -e
          cat server.log
          cat got.txt
          grep -qx "lsl https" got.txt
